{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>{% block title %}My Favorite Places{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'places/style.css' %}">
  </head>
  <body>
    <header class="site-header">
      <a class="logo" href="{% url 'places:home' %}">My Favorite Places</a>
      <nav class="menu">
        <a href="{% url 'places:home' %}">Home</a>
        <a href="{% url 'places:place_list' %}">All places</a>
        <a href="{% url 'places:place_add' %}">Add a place</a>
      </nav>
    </header>
    <main class="content">
      {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
      <p>Created by Daryna Bogaevska</p>
    </footer>
  </body>
</html>
